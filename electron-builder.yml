# Come si impacchetta il Gestore.
#
# Un installer e non una cartella da copiare: il programma va nel menu Start,
# si disinstalla dal pannello di Windows, e — soprattutto — sa aggiornarsi da
# solo, cosa che una cartella copiata a mano non può fare.
appId: it.glos.sierradeck
productName: SierraDeck
copyright: Copyright © 2026 Ferrari Consulenze

# I moduli nativi — node-pty e better-sqlite3 — sono gia' compilati per questa
# versione di Electron: e' cosi' che il programma gira da settimane. Ricompilarli
# richiederebbe Visual Studio su ogni macchina che fa un pacchetto, per ottenere
# esattamente gli stessi binari.
npmRebuild: false

directories:
  output: dist
  buildResources: build

# Solo ciò che serve a eseguire: le sorgenti e i test resterebbero nel pacchetto
# senza servire a niente, e node-pty e better-sqlite3 vanno lasciati fuori
# dall'asar perché sono binari nativi che il sistema deve poter caricare.
files:
  - out/**/*
  - package.json
  # L'icona serve **a runtime**, non solo all'installer: e' quella che compare
  # nell'area di notifica quando si chiude la finestra. Senza, il programma
  # partirebbe lo stesso ma la X tornerebbe a chiudere — che e' il ripiego
  # previsto, non il comportamento voluto.
  - build/icon.png
asarUnpack:
  - '**/node_modules/node-pty/**'
  - '**/node_modules/better-sqlite3/**'
  # ssh2 (il «FileZilla» del progetto) e **le sue dipendenze**.
  #
  # electron-builder tira fuori dall'asar ssh2 da solo, perche' si porta dietro
  # `cpu-features`, che e' nativo e opzionale. Ma tira fuori **solo lui**: asn1
  # e bcrypt-pbkdf restavano dentro l'asar, e da `app.asar.unpacked` la
  # risoluzione dei moduli non ci rientra — sale nelle cartelle vere e non
  # trova niente. Risultato: in sviluppo tutto bene, e nel programma installato
  # `require('ssh2')` falliva al primo collegamento.
  #
  # Trovato guardando dentro il pacchetto, non provando il pannello: e' il tipo
  # di guasto che si vede solo dopo aver installato, cioe' addosso a chi usa.
  - '**/node_modules/ssh2/**'
  - '**/node_modules/asn1/**'
  - '**/node_modules/safer-buffer/**'
  - '**/node_modules/bcrypt-pbkdf/**'
  - '**/node_modules/tweetnacl/**'

win:
  # L'icona già in formato .ico, non il PNG da convertire: la conversione la
  # fa uno strumento WebAssembly che su questa macchina fallisce con «could
  # not allocate memory» e ferma tutta la pubblicazione. Il file è lo stesso
  # che generava lui, prodotto una volta e messo qui.
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]

nsis:
  # Per utente e non per macchina: non chiede l'amministratore, e il Gestore
  # lavora comunque solo sui file di chi lo usa.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SierraDeck
  # A riaprire il programma dopo l'aggiornamento ci pensa SierraDeck Update (il
  # nostro updater C#, in `updater/sorgente.ts` `Avvia()`): aspetta che l'app
  # sia uscita, installa, e la rilancia una volta sola. Se anche l'installer la
  # rilanciasse da solo (`runAfterFinish: true`), i due lanci si accavallerebbero
  # — il `requestSingleInstanceLock` fa uscire una delle due istanze — e a
  # schermo la finestra compare e sparisce, costringendo a riaprirla a mano. Per
  # questo qui è `false`: un solo padrone del riavvio.
  runAfterFinish: false
  deleteAppDataOnUninstall: false

# Dove il programma cerca gli aggiornamenti. `generic` e non un servizio: basta
# una cartella raggiungibile via HTTP — anche sulla rete di casa — dove si
# copiano i file prodotti da `npm run pacchetto`.
# Gli aggiornamenti passano dai Release di GitHub: nessun server da tenere in
# piedi, nessuna password da custodire. Con un repository **pubblico** il
# programma scarica senza credenziali di nessun tipo — che e' esattamente cio'
# che si vuole per un aggiornamento automatico.
#
# Il token per *pubblicare* (GH_TOKEN) resta fuori da qui: si passa dall'ambiente
# al momento di `npm run pubblica`. Un token in un repository e' un token perso.
publish:
  - provider: github
    owner: niko9090
    repo: sierradeck
    releaseType: release
